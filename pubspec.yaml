# pubspec.yaml
name: teacher_exam_manager
description: A comprehensive teacher exam and grade management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Routing
  go_router: ^13.0.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # File Handling
  file_picker: ^11.0.3
  share_plus: ^7.2.1
  open_file: ^3.3.2
  
  # Image Handling
  image_picker: ^1.0.5
  
  # Math/Formula Support
  flutter_math_fork: ^0.7.2
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.2.1
  csv: ^5.1.1
  excel: ^4.0.3
  
  # Date/Time
  table_calendar: ^3.0.9
  
  # Charts
  fl_chart: ^0.66.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.8
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
